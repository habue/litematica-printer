name: Build Minecraft 26.1.2
on:
  push:
    branches: ['26.1.2']
  pull_request:
    branches: ['26.1.2']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build
        run: bash ./gradlew :v26_1_2:build --no-daemon
      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: litematica-printer-mc26.1.2
          path: |
            v26_1_2/build/libs/*.jar
            !v26_1_2/build/libs/*-sources.jar
          if-no-files-found: error
